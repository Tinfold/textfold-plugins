name: check
on: [push, pull_request]
jobs:
  index-is-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # A plugin edited without rebuilding is a version nobody published,
      # which shows up as an editor that cannot find an update it was told
      # about. Better to catch it here.
      - run: ./build.py --check
